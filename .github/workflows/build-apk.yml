name: Build PocketFlow APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mvp
          name: PocketFlow MVP
          body: Personal-use debug APK. Android may ask you to allow installation from your browser or file manager.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
